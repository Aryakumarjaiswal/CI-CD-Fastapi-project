name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- JOB 1: CI (Continuous Integration) ---
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests with Pytest
      run: |
        pytest

    # --- ALERT: Agar tests fail hote hain toh email jayega ---
    - name: Notify Test Failure via Email
      if: failure() # Yeh step TABHI chalega agar pytest fail hoga
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ://gmail.com
        server_port: 465
        username: ${{ secrets.NOTIFICATION_EMAIL_USER }} # Aapka sender email account
        password: ${{ secrets.NOTIFICATION_EMAIL_PASS }} # Aapka App Password
        subject: "🚨 FastAPI CI Alert: Tests Failed on master!"
        to: custom-email-address@domain.com # 👈 Yahan apna woh email likhein jahan alert chahiye (unlinked to GitHub)
        from: GitHub Actions Workflow
        body: |
          Hi Team,
          
          FastAPI CI Pipeline ke 'test' job mein error aayi hai.
          
          - Commit: ${{ github.sha }}
          - Triggered by: ${{ github.actor }}
          
          Kripa karke repository ke Actions tab mein logs check karein.

  # --- JOB 2: CD (Continuous Delivery) ---
  build-and-push:
    needs: test # Runs ONLY if 'test' job succeeds
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/aryakumarjaiswal/fastapi-app:latest 

    # --- ALERT: Agar Docker build & push fail hota hai toh email jayega ---
    - name: Notify Deployment Failure via Email
      if: failure() # Yeh step TABHI chalega agar Docker build fail hoga
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ://gmail.com
        server_port: 465
        username: ${{ secrets.NOTIFICATION_EMAIL_USER }}
        password: ${{ secrets.NOTIFICATION_EMAIL_PASS }}
        subject: "🚨 FastAPI CD Alert: Docker Build/Push Failed!"
        to: custom-email-address@domain.com # 👈 Yahan bhi wahi custom email ID likhein
        from: GitHub Actions Workflow
        body: |
          Hi Team,
          
          FastAPI CD Pipeline ke 'build-and-push' job mein error aayi hai. Docker image push nahi ho paayi.
          
          - Commit: ${{ github.sha }}
          
          Kripa karke GitHub Actions par details check karein.
